<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>AR Urdu Poetry</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #instruction {
      position: fixed;
      top: 10px;
      left: 0;
      width: 100vw;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 3px black;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="instruction">Point your camera at the HIRO marker</div>

  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
    <a-marker preset="hiro">
      <a-text 
        value="چائے دو رائے نہیں"
        color="maroon"
        width="4"
        align="center"
        position="0 0 0"
        rotation="-90 0 0"
        font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt">
      </a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
